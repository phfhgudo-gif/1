modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Player Animation Library: needed on the CLIENT to see the player animations.
# Listed as optional so the mod still loads (and logs a warning) without it.
# Both known mod ids are listed because the library has been published under each of them.
[[dependencies.${mod_id}]]
    modId="player_animation_lib"
    mandatory=false
    versionRange="[1.0.0,)"
    ordering="AFTER"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="playeranimator"
    mandatory=false
    versionRange="[1.0.0,)"
    ordering="AFTER"
    side="CLIENT"
