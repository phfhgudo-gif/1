name: Build mod jar
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build
        run: chmod +x gradlew && ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: thanpisitkub-jar
          path: build/libs/*.jar
      - name: Publish the jar as a release (direct download link)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest build/libs/thanpisitkub-1.0.0.jar \
            --title "Latest build" --notes "Auto-built jar of commit ${GITHUB_SHA::7}" --target "$GITHUB_SHA"
